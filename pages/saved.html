<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../media/horror-movie-icon-7376667-512.png" />
    <title>Saved Movies</title>
  </head>
  <body data-page="saved-films">
    <header class="menu">
      <h1 class="sitename">Hidden Movies</h1>
      <nav class="links">
        <a href="../index.html">Home</a>
        <a href="randomiser.html">Randomiser</a>
        <a href="contacts.html">Contact us</a>
        <a href="#" id="login-trigger">Log in</a>
        <a href="#" id="logout-trigger" hidden>Log out</a>
      </nav>
    </header>
    <main id="empty-saved">
      <section class="card" style="text-align: center">
        <h1 style="margin-bottom: 1%">
          Oops... You haven't saved any movies yet
        </h1>
        <a href="./randomiser.html" style="color: #c45c16"
          ><h3>Maybe you would like to check some?</h3></a
        >
      </section>
    </main>

    <video autoplay muted loop id="bg"></video>
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Log in</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit">Log in</button>
        </form>
      </div>
    </div>
    <script type="module" src="../js/savedFilmsDisplay.js"></script>
    <script src="../js/videoLoader.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
