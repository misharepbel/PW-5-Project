<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randomiser</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="menu">
      <h1 class="sitename">Hidden Movies</h1>
      <nav class="links">
        <a href="index.html">Home</a>
        <a class="logged-in-only">Saved films</a>
        <a href="contacts.html">Contact us</a>
        <a href="#" id="login-trigger">Log in</a>
        <a href="#" id="logout-trigger" hidden>Log out</a>
      </nav>
    </header>
    <main id="randomiser-main">
      <div class="card" id="randomiser-card">
        <label for="genre" class="genre-select-label">Select genre:</label>
        <select name="genre" class="genre-select">
          <option value="bodyHorror">Body horror</option>
          <option value="japaneseArthouse">Japanese arthouse</option>
          <option value="surrealism">Surrealism</option>
          <option value="transgressive">Transgressive</option>
          <option value="existential">Existential</option>
          <option value="experimental">Experimental</option>
          <option value="psychologicalDescent">Psychological descent</option>
          <option value="cult">Cult</option>
          <option value="arthouseMasochists">
            For true arthouse masochists
          </option>
        </select>
        <button class="genre-button">Get film</button>
      </div>
    </main>

    <main id="film-data-section">
      <div class="card" id="film-data-card">
        <span id="add-to-saved"
          ><img src="../media/empty_star.png" alt="Add to saved"
        /></span>
        <h2 id="film-title"></h2>
        <div class="film-main">
          <img src="" alt="Film poster" />
          <div class="film-info">
            <p id="budget"></p>
            <p id="box-office"></p>
            <p id="director"></p>
            <p id="actors"></p>
            <p id="release-date"></p>
            <p id="duration"></p>
          </div>
        </div>
        <p id="description-title">Description:</p>
        <p id="description"></p>
        <div class="trailer">
          <iframe
            src=""
            frameborder="0"
            title="Film trailer"
            allowfullscreen
          ></iframe>
        </div>
        <div class="ratings">
          <fieldset>
            <legend>IMDB</legend>
            <div class="rating-container">
              <span id="imdb-icon"
                ><img src="../media/imdb_icon.webp" alt="IMDB icon"
              /></span>
              <p></p>
            </div>
          </fieldset>
          <fieldset>
            <legend>Rotten Tomatoes</legend>
            <div class="rating-container">
              <span id="rotten-tomatoes-icon"
                ><img
                  src="../media/rotten_tomatoes_icon.png"
                  alt="Rotten Tomatoes icon"
              /></span>
              <p></p>
            </div>
          </fieldset>
          <fieldset>
            <legend>Metacritic</legend>
            <div class="rating-container">
              <span id="metacritic-icon"
                ><img src="../media/metacritic_icon.png" alt="Metacritic icon"
              /></span>
              <p></p>
            </div>
          </fieldset>
        </div>
        <div class="film-data-select-genre">
          <label
            for="genre"
            class="genre-select-label"
            id="data-film-genre-select-label"
            >Select genre:</label
          >
          <div class="film-data-select-container">
            <select name="genre" class="genre-select">
              <option value="bodyHorror">Body horror</option>
              <option value="japaneseArthouse">Japanese arthouse</option>
              <option value="surrealism">Surrealism</option>
              <option value="transgressive">Transgressive</option>
              <option value="existential">Existential</option>
              <option value="experimental">Experimental</option>
              <option value="psychologicalDescent">
                Psychological descent
              </option>
              <option value="cult">Cult</option>
              <option value="arthouseMasochists">
                For true arthouse masochists
              </option>
            </select>
            <button class="genre-button">Get film</button>
          </div>
        </div>
      </div>
    </main>
    <video autoplay muted loop id="bg"></video>
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Log in</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit">Log in</button>
        </form>
      </div>
    </div>
    <script type="module" src="../js/seeder.js"></script>
    <script type="module" src="../js/filmDataDisplay.js"></script>
    <script type="module" src="../js/movieDataFetcher.js"></script>
    <script type="module" src="../js/savedFilmsDisplay.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
