<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Randomiser</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <header class="menu">
      <h1 class="sitename">Hidden Movies</h1>
      <nav class="links">
        <a href="index.html">Home</a>
        <a class="logged-in-only">Saved films</a>
        <a href="contacts.html">Contact us</a>
        <a href="#" id="login-trigger">Log in</a>
        <a href="#" id="logout-trigger" hidden>Log out</a>
      </nav>
    </header>
    <main id="randomiser-main">
      <div class="card" id="randomiser-card">
        <label for="genre" id="genre-select-label">Select genre:</label>
        <select name="genre" id="genre-select">
          <option value="bodyHorror">Body horror</option>
          <option value="japaneseArthouse">Japanese arthouse</option>
          <option value="surrealism">Surrealism</option>
          <option value="transgressive">Transgressive</option>
          <option value="existential">Existential</option>
          <option value="experimental">Experimental</option>
          <option value="psychologicalDescent">Psychological descent</option>
          <option value="cult">Cult</option>
          <option value="arthouseMasochists">
            For true arthouse masochists
          </option>
        </select>
        <button class="get-film-button">Get film</button>
      </div>
    </main>
    <video autoplay muted loop id="bg"></video>
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Log in</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button type="submit">Log in</button>
        </form>
      </div>
    </div>
    <script type="module" src="../js/seeder.js"></script>
    <script type="module" src="../js/movieDataFetcher.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
